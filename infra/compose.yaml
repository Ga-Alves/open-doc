services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - open-doc-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web-server:
    build: ../web-server/
    environment:
      - API_PORT=${API_PORT}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER_NAME=${DB_USER_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    networks:
      - open-doc-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-server.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.web-server.entrypoints=websecure
      - traefik.http.routers.web-server.tls.certresolver=letsencrypt
      - traefik.http.routers.web-server.priority=20
      - traefik.http.services.web-server.loadbalancer.server.port=${API_PORT}
    depends_on:
      - postgres

  webrtc-signaling:
    build: ../webrtc-signaling
    environment:
      - SIGNALING_PORT=${SIGNALING_PORT}
    networks:
      - open-doc-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.webrtc-signaling.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/signaling`)
      - traefik.http.routers.webrtc-signaling.entrypoints=websecure
      - traefik.http.routers.webrtc-signaling.tls.certresolver=letsencrypt
      - traefik.http.routers.webrtc-signaling.priority=20
      - traefik.http.services.webrtc-signaling.loadbalancer.server.port=${SIGNALING_PORT}

  web-client:
    build:
      context: ../web-client/
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SIGNALING_SERVER_HOST: ${VITE_SIGNALING_SERVER_HOST}
    restart: unless-stopped
    networks:
      - open-doc-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-client.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.web-client.entrypoints=websecure
      - traefik.http.routers.web-client.tls.certresolver=letsencrypt
      - traefik.http.routers.web-client.priority=1
      - traefik.http.services.web-client.loadbalancer.server.port=8080

  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - open-doc-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/letsencrypt


volumes:
  postgres_data:
  traefik_data:

networks:
  open-doc-network:
    driver: bridge
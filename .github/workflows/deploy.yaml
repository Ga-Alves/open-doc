name: Production Deploy
on:
  push:
    branches: [master]
jobs:
  ci-web-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Run backend tests
      uses: ./.github/actions/web-server-ci

  ci-web-client:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Run frontend tests
      uses: ./.github/actions/web-client-ci

  deploy:
    needs: [ci-web-backend, ci-web-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd ~/open-doc && \
             git pull git@github.com:Ga-Alves/open-doc.git && \
             cd infra && \
             docker compose --env-file .env.production up -d --build'